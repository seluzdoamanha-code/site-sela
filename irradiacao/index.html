<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Irradiação | Portal SELA</title>
    
    <!-- Metatags para WhatsApp e Redes Sociais (Open Graph) -->
    <meta property="og:title" content="Irradiação Espiritual | Portal SELA">
    <meta property="og:description" content="Faça solicitações de tratamento espiritual à distância para você ou seus entes queridos.">
    <meta property="og:image" content="https://luzdoamanha.org.br/logo_sela_color.png">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            box-sizing: border-box;
        }
        
        .container-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo-area h1 {
            color: var(--primary);
            margin: 0;
            font-size: 24px;
        }
        
        .logo-area p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .dias-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .tag-checkbox-ui {
            background: rgba(0, 0, 0, 0.03);
            border: 2px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            line-height: 1.4;
        }
        
        .tag-checkbox-ui:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }
        
        .tag-checkbox-ui input[type="checkbox"] {
            display: none;
        }
        
        .tag-checkbox-ui input[type="checkbox"]:checked + .tag-content {
            color: var(--primary);
            font-weight: 600;
        }
        
        .tag-checkbox-ui.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.2);
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.3);
        }
        
        .tag-content {
            font-size: 14px;
        }
        
        .tag-sub {
            font-weight: normal;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            color: var(--text-muted);
        }
        
        .tag-checkbox-ui.selected .tag-sub {
            color: var(--primary-light, #a5b4fc);
        }
        
        .btn-block {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            margin-top: 16px;
        }
        
        .input-field {
            border: 2px solid rgba(148, 163, 184, 0.6) !important;
            padding: 12px 16px !important;
            background-color: rgba(0, 0, 0, 0.02) !important;
            border-radius: 8px !important;
            font-size: 15px !important;
        }
        .input-field:focus {
            border-color: var(--primary) !important;
            background-color: rgba(255, 255, 255, 0.08) !important;
            outline: none;
        }
        
        /* Painel de Sucesso */
        #panelSuccess {
            display: none;
            text-align: center;
        }
        
        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .resume-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
        }
        
        .btn-danger {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        
        @media (max-width: 480px) {
            .dias-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* Estilos do Aviso Provisório WhatsApp */
        .card-link-hover {
            display: block;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-link-hover:hover {
            transform: translateY(-3px);
        }
        .btn-whatsapp-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 16px;
            padding: 14px 20px;
            background: #25D366;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-whatsapp-action:hover {
            background: #20bd5a !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5) !important;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <a href="../index.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.05); border-radius: 6px; transition: 0.2s; margin-bottom: 24px;">
            ← Voltar para a Página Inicial
        </a>
        <div class="logo-area">
            <img src="../logo_sela_color.png" alt="Portal SELA" style="max-width: 140px; margin-bottom: 16px; border-radius: 8px;">
            <h1 style="font-size: 22px;">✨ Irradiação Espiritual</h1>
            <p>Solicitação de Tratamento Espiritual</p>
        </div>

        <!-- Aviso Provisório - Solicitação via WhatsApp -->
        <div class="aviso-temporario-box" style="margin-bottom: 8px; text-align: center;">
            <a href="https://wa.me/5547992113498?text=Ol%C3%A1!%20Gostaria%20de%20solicitar%20uma%20nova%20irradia%C3%A7%C3%A3o%20espiritual." target="_blank" rel="noopener noreferrer" class="card-link-hover" title="Clique para abrir o WhatsApp">
                <img src="aviso_whatsapp.jpg" alt="Solicite novas irradiações através do nosso WhatsApp (47) 99211-3498" style="width: 100%; height: auto; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1); display: block;">
            </a>
            
            <a href="https://wa.me/5547992113498?text=Ol%C3%A1!%20Gostaria%20de%20solicitar%20uma%20nova%20irradia%C3%A7%C3%A3o%20espiritual." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-action">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
                Conversar pelo WhatsApp
            </a>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 14px; line-height: 1.5;">
                Clique acima para solicitar o tratamento à distância diretamente com nossa equipe.
            </p>
        </div>

        <!-- Formulário (Provisoriamente Oculto) -->
        <form id="formIrradiacao" style="display: none;">
            <div class="form-group">
                <label for="inNome">Nome(s) Completo(s) do(s) Necessitado(s) *</label>
                <input type="text" id="inNome" class="input-field" required placeholder="EX: MARIA DA SILVA --- JOSÉ DA SILVA" style="width: 100%; box-sizing: border-box; text-transform: uppercase;">
                <label style="display: flex; align-items: center; gap: 8px; margin-top: 12px; cursor: pointer;">
                    <input type="checkbox" id="chkDesencarnado" onchange="toggleDesencarnado(this.checked)" style="width: 18px; height: 18px; accent-color: var(--primary);">
                    <span style="font-size: 14px; font-weight: 500; color: #facc15;">Este nome é de uma pessoa desencarnada (falecida)</span>
                </label>
            </div>
            
            <div class="form-group" id="groupEndereco">
                <label>Endereço Completo</label>
                <input type="text" id="inEndereco" class="input-field" placeholder="RUA, NÚMERO, BAIRRO, CIDADE" style="width: 100%; box-sizing: border-box; text-transform: uppercase;">
            </div>
            
            <div class="form-group">
                <label>Selecione os dias para Irradiação *</label>
                <div class="dias-grid">
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Segunda-feira">
                        <div class="tag-content">Segunda-feira</div>
                        <div class="tag-sub">(Influênciação espiritual)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Terça-feira">
                        <div class="tag-content">Terça-feira</div>
                        <div class="tag-sub">(Saúde física/espiritual)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Quarta-feira (Desobsessão)">
                        <div class="tag-content">Quarta-feira</div>
                        <div class="tag-sub">(Desobsessão)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Quarta-feira (Desencarnado)">
                        <div class="tag-content">Quarta-feira</div>
                        <div class="tag-sub">(Desencarnado)</div>
                    </label>
                    <label class="tag-checkbox-ui" onclick="toggleSelected(this)">
                        <input type="checkbox" class="chk-dia" value="Quinta-feira">
                        <div class="tag-content">Quinta-feira</div>
                        <div class="tag-sub">(Saúde física/espiritual)</div>
                    </label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Enviar Solicitação</button>
        </form>

        <!-- Painel de Sucesso -->
        <div id="panelSuccess">
            <div class="success-icon">✅</div>
            <h2 style="color: #10b981; margin: 0 0 8px 0;">Solicitação Enviada!</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin: 0;">O nome foi adicionado à caixa de entrada da equipe de Irradiação.</p>
            
            <div class="resume-box" id="resumeContent">
                <!-- Preenchido via JS -->
            </div>
            
            <button onclick="novaSolicitacao()" class="btn btn-primary btn-block">Fazer Nova Solicitação</button>
            <button onclick="cancelarSolicitacao()" class="btn btn-danger" id="btnCancel">Apagar Solicitação (Cancelar)</button>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://aymdooyafimliiggxeqs.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5bWRvb3lhZmltbGlpZ2d4ZXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMDUxNDksImV4cCI6MjEwMDY4MTE0OX0.-NBhiyGDlrWq4QKNLx9Ll5GlIk0mV_rBWnr0vdbUCOU';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let estruturaId = urlParams.get('id') || '24c0069b-e161-4a03-8599-c4ae054301e3'; // Default para SELA
        
        let lastInsertedIds = [];

        function toggleSelected(labelElement) {
            const chk = labelElement.querySelector('input');
            setTimeout(() => {
                if(chk.checked) {
                    labelElement.classList.add('selected');
                } else {
                    labelElement.classList.remove('selected');
                }
            }, 10);
        }

        function toggleDesencarnado(isDesencarnado) {
            const inputEndereco = document.getElementById('inEndereco');
            const groupEndereco = document.getElementById('groupEndereco');
            const chkQuartaDesencarnado = document.querySelector('input[value="Quarta-feira (Desencarnado)"]');
            
            if (isDesencarnado) {
                inputEndereco.disabled = true;
                inputEndereco.value = '';
                inputEndereco.placeholder = 'NÃO É NECESSÁRIO PARA DESENCARNADOS';
                groupEndereco.style.opacity = '0.5';
                
                // Força o dia Quarta-feira (Desencarnado)
                if (chkQuartaDesencarnado && !chkQuartaDesencarnado.checked) {
                    chkQuartaDesencarnado.checked = true;
                    chkQuartaDesencarnado.parentElement.classList.add('selected');
                }
            } else {
                inputEndereco.disabled = false;
                inputEndereco.placeholder = 'RUA, NÚMERO, BAIRRO, CIDADE';
                groupEndereco.style.opacity = '1';
                
                // Desmarca se o usuário desmarcou desencarnado
                if (chkQuartaDesencarnado && chkQuartaDesencarnado.checked) {
                    chkQuartaDesencarnado.checked = false;
                    chkQuartaDesencarnado.parentElement.classList.remove('selected');
                }
            }
        }

        document.getElementById('formIrradiacao').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            let nome = document.getElementById('inNome').value.toUpperCase();
            const endereco = document.getElementById('inEndereco').value.toUpperCase();
            const isDesencarnado = document.getElementById('chkDesencarnado').checked;
            
            if (isDesencarnado) {
                nome = "[DESENCARNADO] " + nome;
            }
            
            const checkboxes = document.querySelectorAll('.chk-dia:checked');
            const dias = Array.from(checkboxes).map(c => c.value);
            
            if (dias.length === 0) {
                alert("Selecione pelo menos um dia para a Irradiação.");
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            try {
                const recordsToInsert = dias.map(dia => ({
                    estrutura_id: estruturaId,
                    nome_solicitado: nome,
                    endereco: endereco,
                    dias_semana: dia,
                    status: 'pendente',
                    leituras: 0,
                    criado_por: 'Site Externo'
                }));
                
                const { data, error } = await db.from('app_irradiacao_solicitacoes').insert(recordsToInsert).select();
                if (error) throw error;
                
                // Salvar IDs em memória para poder cancelar
                lastInsertedIds = data.map(r => r.id);
                
                // Mostrar Sucesso
                document.getElementById('formIrradiacao').style.display = 'none';
                document.getElementById('panelSuccess').style.display = 'block';
                
                document.getElementById('resumeContent').innerHTML = `
                    <strong>Nome:</strong> ${nome}<br>
                    <strong>Endereço:</strong> ${endereco || 'Não informado'}<br>
                    <strong style="display:block; margin-top:8px;">Dias:</strong> 
                    ${dias.join('<br>')}
                `;
                
            } catch (err) {
                console.error(err);
                alert("Erro ao enviar solicitação. Tente novamente.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Solicitação';
            }
        });

        function novaSolicitacao() {
            document.getElementById('formIrradiacao').reset();
            document.querySelectorAll('.tag-checkbox-ui').forEach(el => el.classList.remove('selected'));
            toggleDesencarnado(false);
            document.getElementById('formIrradiacao').style.display = 'block';
            document.getElementById('panelSuccess').style.display = 'none';
            lastInsertedIds = []; // Limpa memória
        }

        async function cancelarSolicitacao() {
            if (lastInsertedIds.length === 0) return;
            if (!confirm("Tem certeza que deseja cancelar e apagar esta solicitação?")) return;
            
            const btn = document.getElementById('btnCancel');
            btn.disabled = true;
            btn.textContent = 'Apagando...';
            
            try {
                for (const id of lastInsertedIds) {
                    await db.from('app_irradiacao_solicitacoes').delete().eq('id', id);
                }
                alert("Solicitação apagada com sucesso.");
                novaSolicitacao();
            } catch (err) {
                console.error(err);
                alert("Erro ao apagar solicitação.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Apagar Solicitação (Cancelar)';
            }
        }
    </script>
</body>
</html>
